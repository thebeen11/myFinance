<!--
  The app icon: the same mark as components/shell/brand-mark.tsx — a lucide `house`
  glyph on the brand green — drawn at 512 so a launcher has something to downscale.

  Colours are the sRGB rendering of --primary and --primary-foreground from
  globals.css. They are literals rather than var() because an icon is fetched
  standalone, with no stylesheet behind it.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Erumah">
  <rect width="512" height="512" rx="114" fill="#45c06a"/>
  <g transform="translate(128 128) scale(10.6667)" fill="none" stroke="#121a1a" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/>
    <path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
  </g>
</svg>
